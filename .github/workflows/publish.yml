# Publishes a Luna release. Claude pushes the installer (in pieces, because GitHub
# limits files to 100 MB) to a branch named upload/vX.Y.Z; this joins the pieces,
# creates the release that installed copies of Luna update from, then deletes the branch.
name: Publish release
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Join installer and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#upload/}"
          cd release
          cat installer.part* > "$(cat installer.name)"
          sha512sum -c installer.sha512
          FILES="$(cat installer.name) latest.yml"
          [ -f latest-mac.yml ] && FILES="$FILES latest-mac.yml"
          [ -f "$(cat installer.name).blockmap" ] && FILES="$FILES $(cat installer.name).blockmap"
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --title "Luna ${TAG#v}" --notes-file notes.md
      - name: Remove upload branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
